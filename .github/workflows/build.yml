name: Build Project and Run Tests

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  CARGO_TERM_COLOR: always
  PKG_CONFIG_PATH: /usr/lib/pkgconfig

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Fast checks first ----
      # Fail in seconds on lint / format before the multi-minute CLI build +
      # Docker network below, so trivial fixes don't pay the full cost.
      #
      # The scaffold monorepo also ran scripts/check-dep-parity.mjs here. It
      # compares the dependencies of every app under templates/, which
      # `stellar scaffold init` removes, so in this project it always failed.

      - run: npm ci
      - run: npm run lint

      # R19: the app unit tests and the control-policy contract tests.
      - name: App unit tests
        run: npm test --workspace app
      - name: control-policy contract tests
        run: cargo test -p control-policy

      # ---- Slow path: CLI toolchain, local network, contract codegen ----
      - uses: actions/cache@v3
        with:
          # NB: ~/.cargo/bin is deliberately NOT cached here — the
          # stellar-scaffold binary is cached separately keyed on the CLI
          # commit SHA (see "Cache stellar-scaffold binary"). Caching it under
          # the UI Cargo.lock key would restore a stale/mismatched binary.
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run:
          sudo apt-get update && sudo apt-get install -y libudev-dev
          libdbus-1-dev pkg-config
      # Install binstall to quickly install stellar-scaffold-cli
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      # Label a PR `cross-repo` to build the CLI from a same-named branch on the
      # CLI repo, so coordinated cross-repo changes can go green before the CLI
      # is released. Unlabeled PRs always use the released CLI (fast path).
      - name: Resolve CLI source
        id: cli
        env:
          CROSS_REPO:
            ${{ contains(github.event.pull_request.labels.*.name, 'cross-repo')
            }}
        run: |
          REF="${{ github.head_ref }}"
          if [ "$CROSS_REPO" != "true" ]; then
            echo "Using released CLI (binstall)."
            echo "To build against a CLI branch, label this PR 'cross-repo'."
            exit 0
          fi
          SHA=$(git ls-remote --heads \
            https://github.com/stellar-scaffold/cli "$REF" 2>/dev/null \
            | cut -f1)
          if [ -z "$SHA" ]; then
            echo "::error::PR is labeled 'cross-repo' but no branch named" \
              "'$REF' exists on stellar-scaffold/cli. Push that branch," \
              "or remove the label to use the released CLI."
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building CLI from branch $REF ($SHA)"
      # Check for stellar-scaffold-cli binary and install if not present
      - name: Install stellar-scaffold (released, fast)
        if: steps.cli.outputs.ref == ''
        run: |
          if ! command -v stellar-scaffold &> /dev/null; then
            echo "stellar-scaffold not found, installing..."
            # --locked so the source-build fallback uses the CLI's published
            # Cargo.lock instead of resolving fresh soroban deps whose MSRV
            # may outrun the pinned toolchain.
            cargo binstall --locked stellar-scaffold-cli
          else
            echo "stellar-scaffold already installed. Clear cache to force reinstall."
          fi
      # Cache the branch-built binary keyed on the CLI commit SHA, so reruns
      # without a CLI push skip the ~14 min rebuild but a new CLI commit busts
      # the cache.
      - name: Cache stellar-scaffold binary
        if: steps.cli.outputs.ref != ''
        id: cli-cache
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/stellar-scaffold
          key: cli-bin-${{ runner.os }}-${{ steps.cli.outputs.sha }}
      - name: Install stellar-scaffold (from CLI branch)
        if:
          steps.cli.outputs.ref != '' && steps.cli-cache.outputs.cache-hit !=
          'true'
        run: |
          # `cargo install --git` builds with the runner's default toolchain and
          # ignores the CLI repo's rust-toolchain.toml — but the CLI's deps
          # (soroban-cli, stellar-rpc-client, …) require a newer rustc than the
          # runner ships. Clone the branch and install from the path so, with the
          # clone as the working dir, rustup honors the pinned toolchain
          # (auto-installed on demand).
          git clone --depth 1 --branch "${{ steps.cli.outputs.ref }}" \
            https://github.com/stellar-scaffold/cli "$RUNNER_TEMP/cli-src"
          cd "$RUNNER_TEMP/cli-src"
          cargo install --path crates/stellar-scaffold-cli --locked
      - name: Start Stellar local network
        uses: stellar/quickstart@main
        with:
          enable: "core,rpc"
          # Match Scaffold CLI's local-network image and protocol. The floating
          # latest image moved to RPC 30 but still defaults to ledger protocol
          # 28, which its protocol-29/30 simulation hosts cannot simulate.
          tag: v678-b1525.1-testing
          protocol_version: "29"
      - name: Check local network protocol
        run: |
          # A healthy RPC alone does not guarantee protocol compatibility.
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"getVersionInfo"}' \
            http://localhost:8000/rpc | jq .
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"getLatestLedger"}' \
            http://localhost:8000/rpc | jq -e '.result.protocolVersion == 29'
      # Generate a throwaway identity on the CI's local network and fund it with
      # friendbot. No key is stored in the repo.
      # The identity step below calls the `stellar` CLI. Pin the version that
      # the team uses locally (scripts/dev-guard.mjs installs it the same way).
      - name: Install stellar-cli
        run: cargo binstall -y --locked stellar-cli@28.1.0
      - name: Add funded local identity as default
        run: |
          stellar keys generate me --network local --fund --overwrite
      - name: Build with Scaffold and build client packages
        run: |
          # Setting pipefail so a failed build's exit status isn't overwritten
          # by a successful call of `tee`
          set -o pipefail
          # Released CLIs still need --build-clients; newer ones only note
          # that it's redundant for a version 2 scaffold.yml
          stellar-scaffold build --build-clients --network local 2>&1 \
            | tee build_clients.log
      - name: Check client generation summary
        run: |
          # Extract the number after "Failed: "
          FAILED=$(grep -Eo "Failed: [0-9]+" build_clients.log | awk '{print $2}')
          if [ -z "$FAILED" ]; then
            # Only reachable when the build exited 0, so a missing summary line
            # means nothing failed rather than that the generator died early.
            echo "Could not find 'Failed: N' in build_clients.log, all clients succeeded."
            exit 0
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "Client generation summary check failed: Failed: $FAILED"
            echo "Check the \"Build with Scaffold\" step logs."
            exit 1
          fi
      # Assert that client generation worked by checking the actual build
      # artifacts rather than relying on exit status, which could still be 0
      # even if nothing was built.
      - name: Check generated clients
        run: |
          INDEX=app-lib/clients/index.ts
          if [ ! -s "$INDEX" ]; then
            echo "Expected $INDEX to exist and be non-empty after client generation."
            exit 1
          fi
          # Count one client constructor per contract that scaffold.yml
          # declares; the shared `options` export is not a client. A folder
          # under contracts/ that scaffold.yml does not list (such as
          # control-policy, deployed outside the scaffold) gets no client.
          EXPECTED=0
          for dir in contracts/*/; do
            if grep -Eq "^  $(basename "$dir"):" scaffold.yml; then
              EXPECTED=$((EXPECTED + 1))
            fi
          done
          ACTUAL=$(grep -c "^export const .* = new " "$INDEX" || true)
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "Expected $EXPECTED client(s) in $INDEX, found $ACTUAL."
            echo "Partial client generation, check the \"Build with Scaffold\" step."
            grep "^export const .* = new " "$INDEX" || echo "(no clients)"
            exit 1
          fi
          echo "Generated $ACTUAL client(s)."
      - run: npm run build --workspaces --if-present
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run cross-framework parity smoke tests
        run: npx playwright test tests/smoke.spec.ts
        working-directory: e2e
